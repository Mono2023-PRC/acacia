[package]
name = "acacia-netease"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MCP stdio server driving a Minecraft: Bedrock bot (acacia-bot) through a local Shuttler proxy to a NetEase rental server"
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "acacia-netease"
path = "src/main.rs"

[dependencies]
acacia-bot = { path = "../acacia-bot" }
acacia-world.workspace = true
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync", "io-std", "io-util"] }
