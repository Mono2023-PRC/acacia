[package]
name = "acacia-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "An LLM-driven survival agent on top of acacia-bot: tool registry, perception snapshot, agent loop, memory and guardrails"
publish = false

[[bin]]
name = "acacia-agent"
path = "src/main.rs"

[dependencies]
acacia-bot = { path = "../acacia-bot" }
acacia-world.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync", "io-std", "io-util", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
acacia-bot = { path = "../acacia-bot" }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "io-std", "io-util", "net", "fs"] }
